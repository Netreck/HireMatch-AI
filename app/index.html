    <style>
      /* Critical CSS for faster initial paint */
      :root {
        color-scheme: dark;
      }
      html {
        background: hsl(160 25% 4%);
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: hsl(160 25% 4%);
      }
      /* Initial loading state */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #root:empty::after {
        content: '';
        width: 48px;
        height: 48px;
        border: 3px solid hsl(142 69% 58% / 0.2);
        border-top-color: hsl(142 69% 58%);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
